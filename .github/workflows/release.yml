name: macOS 打包与发布

on:
  push:
    tags: ['v*']
  workflow_dispatch:

# 构建只读；只有发布任务可以写 Release。
permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: 确定版本与构建号
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [[ "$REF_TYPE" == tag ]]; then
            if [[ ! "$REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo '错误：发布标签必须为 v主版本.次版本.修订号'
              exit 1
            fi
            echo "LUMEN_VERSION=${REF_NAME#v}" >> "$GITHUB_ENV"
          else
            echo 'LUMEN_VERSION=1.3.0' >> "$GITHUB_ENV"
          fi
          echo "LUMEN_BUILD_NUMBER=$GITHUB_RUN_NUMBER" >> "$GITHUB_ENV"
      - name: 运行 Swift 与采集脚本测试
        run: |
          swift test
          python3 tools/test_ios_logs.py
      - name: 构建 Universal 应用
        run: bash scripts/build-app.sh release universal
      - name: 打包与校验
        run: |
          package="Lumen-v${LUMEN_VERSION}-macOS-universal.zip"
          ditto -c -k --sequesterRsrc --keepParent dist/Lumen.app "dist/$package"
          cd dist
          shasum -a 256 "$package" > "$package.sha256"
      - name: 保存下载包
        uses: actions/upload-artifact@v4
        with:
          name: Lumen-macOS-universal
          path: |
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error
          retention-days: 14

  release:
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Lumen-macOS-universal
          path: packages
      - name: 创建 Release 并上传下载包
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          # 重跑时补传附件；不覆盖已经发布的同名安装包。
          if gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" packages/*
          else
            gh release create "$RELEASE_TAG" packages/* \
              --verify-tag --title "Lumen $RELEASE_TAG" --generate-notes \
              --notes '支持 macOS 14+、Apple Silicon 和 Intel。下载 Universal ZIP 后解压使用。当前采用临时签名，尚未进行 Apple Developer ID 签名与公证；采集需要本机安装完整 Xcode。'
          fi
